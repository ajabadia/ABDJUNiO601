name: ABDJUNiO601 CI

# =============================================================================
# POR QUE ESTE WORKFLOW EXISTE
# =============================================================================
# Este repo no tenia ninguna puerta: el plugin se compilaba solo en la
# maquina de desarrollo. Este workflow pone el build a bloquear en Linux y
# Windows con TODO fijado, y deja escrito lo que aun no existe todavia.
#
# DEPENDENCIAS, TODO FIJADO
# -------------------------
# - JUCE 8.0.12: es la version del checkout que ya vive en el repo en
#   ./JUCE (primer eslabon de la cadena de discovery del CMakeLists) y con
#   la que esta medido el build local. En el runner se clona ahi mismo.
#   No es 9.0.3 como MS2000/Neural: aqui el proyecto no se ha portado a
#   JUCE 9, y fijar otra version seria una apuesta.
# - ABDSharedCode como hermano del workspace, a SHA. El CMakeLists linka
#   ABDShared::LutDSP, ABDShared::DspCore y ABDShared::HardwareDrivers y NO
#   tiene fallback FetchContent: sin el hermano al lado, el configure muere
#   en "target not found". Es el mismo motivo y el mismo reparto que CZ101.
# - WebView2 SDK en Windows: juce_add_plugin(NEEDS_WEBVIEW2 TRUE) exige
#   find_package(WebView2) al configurar y el runner no trae el SDK.
#
# HIGIENE
# -------
# clang-format no entra: este repo no tiene .clang-format ni hooks de
# formato, asi que no hay config que validar. cppcheck es BLOQUEANTE CON
# BASELINE (.github/cppcheck-baseline.txt): midiendo HEAD el 2026-10-12 con
# cppcheck 2.21 y el comando exacto de la CI salieron 29 firmas de deuda
# (31 hallazgos en bruto, sobre todo en Core/CalibrationSettings y
# Core/Tests/SmartTapeTests), que son las UNICAS que deja pasar — cualquier
# hallazgo nuevo bloquea. OJO con el `2>&1`: cppcheck escribe los hallazgos
# en stderr, y medir sin el siempre cuenta 0 — de ahi el "0" erroneo que
# traia escrito este gate.
#
# LO QUE NO EXISTE TODAVIA: unit tests. El CMakeLists no define ni un
# add_executable de test ni un add_test, asi que no hay nada que ctest
# pueda correr, y una puerta que no tiene que abrir no es una puerta. El
# alcance de hoy es que el plugin COMPILE en verde en las dos plataformas;
# cuando haya targets de test, el paso de abajo pasa a ctest bloqueante.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junio601-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_TAG: '8.0.12'
  SHA_SHARED: 'fd30eec888b540dfa21421037057a5caf75dddf8'  # ABDSharedCode master

jobs:
  build:
    name: Build plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ABDJUNiO601
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout ABDJUNiO601
      uses: actions/checkout@v7
      with:
        path: ABDJUNiO601

    - name: Checkout ABDSharedCode (hermano, SHA fijo)
      uses: actions/checkout@v7
      with:
        repository: ajabadia/ABDSharedCode
        ref: ${{ env.SHA_SHARED }}
        path: ABDSharedCode
        fetch-depth: 1

    # ./JUCE es el primer eslabon de la cadena de discovery; el repo ya
    # trabaja con 8.0.12 ahi en local.
    - name: Fetch JUCE ${{ env.JUCE_TAG }} into ./JUCE
      run: |
        git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE

    # Lista de dependencias JUCE en Linux copiada de la que ya esta medida
    # verde en la suite de CZ101 (libwebkit2gtk-4.1, no 4.0: el 4.0 se
    # elimino de Ubuntu y `ubuntu-latest` ya no lo trae).
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev libxcomposite-dev libxcursor-dev libxcursor1 libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libglu1-mesa-dev mesa-common-dev

    # JUCE 8 pide webkit2gtk-4.0 cuando no encuentra el 4.1, y Ubuntu 26 ya solo
    # trae 4.1 (medido: 2.52.6 en resolute). pkg-config localiza el modulo por el
    # NOMBRE DEL FICHERO .pc, asi que un alias del 4.1 resuelve el configure sin
    # tocar el codigo ni la version de JUCE.
    - name: Alias pkg-config webkit2gtk-4.0 a 4.1 (Linux)
      if: runner.os == 'Linux'
      run: |
        pkg-config --exists webkit2gtk-4.1 && echo "webkit2gtk-4.1 presente"
        if pkg-config --exists webkit2gtk-4.1 && ! pkg-config --exists webkit2gtk-4.0; then
          dir=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
          sudo cp "$dir/webkit2gtk-4.1.pc" "$dir/webkit2gtk-4.0.pc"
        fi
        pkg-config --modversion webkit2gtk-4.0

    - name: Set up MSBuild (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v3

    - name: Install WebView2 SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = "1.0.4258.31"
        $root = Join-Path $env:RUNNER_TEMP "webview2"
        $pkg = Join-Path $root "Microsoft.Web.WebView2"
        New-Item -ItemType Directory -Force -Path $pkg | Out-Null
        $zip = Join-Path $env:RUNNER_TEMP "webview2.zip"
        Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $pkg -Force
        if (-not (Test-Path (Join-Path $pkg "build/native/include/WebView2.h"))) {
          Write-Error "Falta WebView2.h: la descarga del SDK ha fallado"
          exit 1
        }
        "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Configure CMake
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          cmake -S . -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${WEBVIEW2_ROOT:-}"
        else
          # -fPIC: las librerias estaticas del checkout hermano se enlazan
          # dentro del .so del VST3, y sin PIC el enlazador rechaza la
          # relocation (R_X86_64_PC32 against St9bad_alloc).
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        fi

    # BLOQUEANTE: el plugin entero (Standalone + VST3; AU solo se define en
    # Apple, JUCE lo ignora en Linux).
    # Se compilan los DOS targets del plugin y no "todo": el checkout hermano
    # registra tambien ejecutables de sonda (ABDShared_SegmentedProbe) que en
    # Linux no enlazan libcurl, y este gate es sobre el plugin.
    - name: Build Plugin (Release)
      run: cmake --build build --config Release --parallel 2 --target ABDSimpleJuno106_VST3 ABDSimpleJuno106_Standalone

  cppcheck:
    name: cppcheck (bloqueante, baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7

    # BLOQUEANTE CON BASELINE desde el 2026-10-12 (29 firmas medidas en HEAD,
    # ver cabecera): solo bloquean hallazgos FUERA de la baseline, la ausencia
    # de la propia baseline y que la comprobacion no llegue a medirse.
    #
    # EXCLUIDOS: el listado con el motivo de cada exclusion viven en
    # .github/cppcheck-excludes.txt, que este gate lee antes de medir; aqui no se
    # enumeran para que workflow, comentario y baseline no puedan divergir. Se
    # excluyen tambien los que hoy aportan 0 firmas, para que la estampacion o
    # generacion futura no cuente como deuda medida.
    - name: Cache de cppcheck 2.21.0
      uses: actions/cache@v6
      with:
        path: ~/cppcheck-2.21.0
        key: cppcheck-2.21.0-${{ runner.os }}

    # cppcheck SIN fijar usa la version que traiga la imagen, y la baseline es
    # por firma (severidad|archivo|mensaje): un cppcheck de otra version cambia
    # mensajes y anade/quita hallazgos, y el gate mentiria en las dos direcciones.
    # La unica version aceptada es 2.21.0, con la que se midio la baseline en
    # local. apt no la trae, asi que se compila desde el tag oficial (PCRE es
    # opcional: `make` solo necesita g++/make) y el binario se cachea por
    # version: un cache-miss cuesta ~5 min de compilacion.
    - name: Install cppcheck 2.21.0 (fijado a la version de las baselines)
      shell: bash
      run: |
        v=2.21.0
        pre="$HOME/cppcheck-$v"
        if ! "$pre/bin/cppcheck" --version 2>/dev/null | grep -F "Cppcheck $v" >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make
          src=$(mktemp -d)
          git clone --depth 1 --branch "$v" https://github.com/cppcheck-opensource/cppcheck.git "$src/cppcheck"
          # FILESDIR hace dos cosas a la vez: sin el, el objetivo install del
          # Makefile aborta con "FILESDIR must be set!", y con el compilado el
          # binario sabe donde estan cfg/addons/platforms bajo el prefijo.
          make -C "$src/cppcheck" -j"$(nproc)" FILESDIR="$pre/share/cppcheck"
          make -C "$src/cppcheck" PREFIX="$pre" FILESDIR="$pre/share/cppcheck" install
        fi
        "$pre/bin/cppcheck" --version
        if ! "$pre/bin/cppcheck" --version | grep -F "Cppcheck $v" >/dev/null; then
          echo "::error title=cppcheck::se esperaba cppcheck 2.21.0, la version con la que se midieron las baselines."
          exit 1
        fi
        echo "$pre/bin" >> "$GITHUB_PATH"

    - name: Static analysis (cppcheck) - bloqueante (baseline)
      run: |
        baseline=.github/cppcheck-baseline.txt
        if [ ! -f "$baseline" ]; then
          echo "::error title=cppcheck::no existe $baseline: sin baseline no se puede separar deuda de regresion."
          exit 1
        fi
        # Tolerancia CRLF: si la baseline se commiteo con finales Windows,
        # grep -f no casaria nada y TODO pareceria hallazgo nuevo.
        bl=$(mktemp)
        tr -d '\r' < "$baseline" > "$bl"
        # Exclusiones: UNICA fuente .github/cppcheck-excludes.txt — una entrada por
        # linea ('#' comenta); sin '-' inicial es patron de --suppress y con '-' es
        # flag literal. Un fichero ausente es error: sin el, workflow, comentario y
        # baseline divergirian, que es exactamente lo que este diseno evita.
        excludes=.github/cppcheck-excludes.txt
        if [ ! -f "$excludes" ]; then
          echo "::error title=cppcheck::no existe $excludes: las exclusiones viven ahi y solo ahi."
          exit 1
        fi
        supresiones=()
        while IFS= read -r linea || [ -n "$linea" ]; do
          linea=${linea%%#*}
          linea=${linea#"${linea%%[![:space:]]*}"}
          linea=${linea%"${linea##*[![:space:]]}"}
          [ -z "$linea" ] && continue
          if [ "${linea:0:1}" = "-" ]; then
            read -r -a partes <<< "$linea"
            supresiones+=("${partes[@]}")
          else
            supresiones+=("--suppress=$linea")
          fi
        done < "$excludes"
        set +e
        salida=$(cppcheck --enable=warning,performance,portability --std=c++20 --suppress=missingIncludeSystem "${supresiones[@]}" --template='{severity}|{file}|{line}|{message}' Source/ 2>&1)
        codigo=$?
        set -e
        if [ -z "$salida" ]; then
          echo "::error title=cppcheck::cppcheck no ha producido ni una linea (codigo $codigo): la comprobacion no llego a medirse."
          exit 1
        fi
        tmp=$(mktemp)
        printf '%s\n' "$salida" > "$tmp"
        actuales=$(python3 - "$tmp" <<'PY'
        import re, sys
        out = set()
        pat = re.compile(r"^(warning|performance|portability|error)\|([^|]+)\|[^|]+\|(.*)$")
        for ln in open(sys.argv[1], encoding="utf-8", errors="replace"):
            m = pat.match(ln.rstrip("\n"))
            if m:
                out.add(m.group(1) + "|" + m.group(2).replace("\\", "/") + "|" + m.group(3))
        print("\n".join(sorted(out)))
        PY
        )
        rm -f "$tmp"
        nuevos=$(printf '%s\n' "$actuales" | grep -vxF -f "$bl" || true)
        if [ -n "$nuevos" ]; then
          printf '%s\n' "$nuevos" | sed -n '1,30p'
          n=$(printf '%s\n' "$nuevos" | grep -c . || true)
          echo "::error title=cppcheck::${n} hallazgos NUEVOS fuera de la baseline: regresion. Arreglo: atacarlos; solo si es deuda aceptada deliberadamente, anadir su firma a $baseline en el MISMO PR."
          exit 1
        fi
        af=$(mktemp)
        printf '%s\n' "$actuales" > "$af"
        obsoletas=$(grep -v '^#' "$bl" | grep -vxF -f "$af" | grep -c . || true)
        rm -f "$af"
        if [ "$obsoletas" -gt 0 ]; then
          echo "::notice title=cppcheck::${obsoletas} firmas de la baseline ya no aparecen: deuda pagada — prune $baseline."
        fi
        echo "::notice title=cppcheck::sin hallazgos nuevos ($(grep -cv '^#' "$bl") firmas baseladas, ${obsoletas} obsoletas)."
        rm -f "$bl"
        exit 0

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # FORMATO (clang-format) — BLOQUEANTE CON BASELINE desde 2026-10-13.
  #
  # No compila nada: lee .clang-format y comprueba que todos los .h/.cpp
  # trackeados obedecen el estilo. Lo hace ejecutando EL HOOK del repo en
  # modo VERIFY_ONLY (VERIFY_ONLY=1 bash .githooks/pre-commit), que usa
  # --dry-run --Werror sobre `git ls-files` y no toca disco. Asi esta puerta
  # valida DOS cosas: que el estilo cuadra, y que EL HOOK funciona.
  #
  # ESTABA INFORMATIVO POR SU DEUDA, y la cuenta sigue escrita aqui porque es
  # el tamano de la bolsa que la baseline congela: MEDIDO en local con
  # clang-format 18.1.8 sobre los .h/.cpp trackeados: 106983 avisos de estilo en 613 ficheros. Nota sobre el recuento
  # de AQUI: de los 106983, unos 92000 estan en wasm/juce_core y
  # wasm/juce_shim, que es codigo de JUCE vendido para el puerto wasm; la
  # deuda del codigo nuestro (Source/) es de unos 15000 avisos.
  # El remedio es el mismo que aplico al cppcheck de la familia: baseline en
  # .github/clang-format-baseline.txt y solo bloquean hallazgos NUEVOS. La
  # firma es POR FICHERO (fichero|mensaje) porque el mensaje de clang-format
  # es generico — "code should be clang-formatted" — y linea/col se mueven
  # con cualquier edicion: el candado es que NINGUN fichero nuevo tenga
  # deuda, y cada fichero re-formateado solo genera el aviso de prune. La
  # firma se extrae de la MISMA medicion de siempre (VERIFY_ONLY del hook).
  #
  # Y DOS COSAS SIGUEN BLOQUEANDO, porque no son deuda: que la comprobacion no
  # llegue a medir (clang-format ausente, o un VERIFY_ONLY que falla sin
  # reportar ni un aviso), y el test NEGATIVO de abajo, que exige que el
  # hook NOMBRE el fichero mal formateado en su salida.
  # GUARD DE DIRECCION DEL BRIDGE (WebView2) — BLOQUEANTE, sin baseline: es
  # barato (segundos) y la regla no admite matices. Escribir desde C++ un evento
  # del canal JS -> nativo no llega a ningun listener y SE DESCARTA EN SILENCIO;
  # paso en ABDMS2000. La logica es la MISMA que usan sus suites de vitest, para
  # que los tres repos no puedan divergir en que es "direccion correcta".
  webview-guard:
    name: Guard de direccion del bridge WebView2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: ABDJUNiO601
    steps:
    - name: Checkout ABDJUNiO601
      uses: actions/checkout@v7
      with:
        path: ABDJUNiO601

    - name: Checkout ABDSharedCode (hermano, SHA fijo)
      uses: actions/checkout@v7
      with:
        repository: ajabadia/ABDSharedCode
        ref: ${{ env.SHA_SHARED }}
        path: ABDSharedCode
        fetch-depth: 1

    - name: Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Guard de direccion (nativo -> JS) - bloqueante
      run: node scripts/check_webview_bridge_direction.mjs

  clang-format:
    name: Clang-format (estilo C++, bloqueante con baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # El `command -v` es una puerta, no un eco: sin clang-format en el PATH
      # el hook NO falla (imprime un aviso y sale con 0), y el paso de abajo
      # reportaria "sin deuda" sin haber mirado nada. Un verde que no ha medido
      # es el peor de todos.
      - name: Install clang-format 18+
        run: |
          pip install clang-format==18.*
          command -v clang-format
          clang-format --version

      - name: Check formatting (clang-format via hook) - bloqueante (baseline)
        shell: bash
        run: |
          baseline=.github/clang-format-baseline.txt
          if [ ! -f "$baseline" ]; then
            echo "::error title=clang-format::no existe $baseline: sin baseline no se puede separar deuda de regresion."
            exit 1
          fi
          # Tolerancia CRLF: si la baseline se commiteo con finales Windows,
          # grep -f no casaria nada y TODO pareceria fichero nuevo.
          bl=$(mktemp)
          tr -d '\r' < "$baseline" > "$bl"
          set +e
          VERIFY_ONLY=1 bash .githooks/pre-commit > "$RUNNER_TEMP/fmt.log" 2>&1
          codigo=$?
          set -e
          avisos=$(grep -c 'code should be clang-formatted' "$RUNNER_TEMP/fmt.log" || true)
          # Un VERIFY_ONLY que sale con != 0 SIN ningun aviso de formato no es
          # deuda: es que la comprobacion no llego a hacerse (config rota,
          # hook roto, clang-format de otra version). Eso SI bloquea.
          if [ "$codigo" -ne 0 ] && [ "$avisos" -eq 0 ]; then
            echo "::error title=clang-format::el hook VERIFY_ONLY fallo (codigo $codigo) sin reportar ni un aviso de formato: la comprobacion no llego a medirse. Log completo abajo."
            cat "$RUNNER_TEMP/fmt.log"
            exit 1
          fi
          # Firmas: fichero|mensaje, SIN linea/col (se mueven al editar).
          tmp=$(mktemp)
          { grep 'code should be clang-formatted' "$RUNNER_TEMP/fmt.log" || true; } \
            | sed -E 's/^([^:]+):[0-9]+:[0-9]+: [a-z]+: (.*)$/\1|\2/' \
            | sort -u > "$tmp"
          nuevos=$(grep -vxF -f "$bl" "$tmp" || true)
          if [ -n "$nuevos" ]; then
            printf '%s\n' "$nuevos" | sed -n '1,30p'
            n=$(printf '%s\n' "$nuevos" | grep -c . || true)
            echo "::error title=clang-format::${n} ficheros NUEVOS con deuda de formato fuera de la baseline: regresion. Arreglo: clang-format-18 -i sobre los ficheros nombrados; solo si es deuda aceptada deliberadamente, anadir su firma a $baseline en el MISMO PR."
            exit 1
          fi
          af=$(mktemp)
          cp "$tmp" "$af"
          obsoletas=$(grep -v '^#' "$bl" | grep -vxF -f "$af" | grep -c . || true)
          rm -f "$af" "$tmp"
          if [ "$obsoletas" -gt 0 ]; then
            echo "::notice title=clang-format::${obsoletas} ficheros de la baseline ya no tienen deuda: deuda pagada — prune $baseline."
          fi
          echo "::notice title=clang-format::sin ficheros nuevos con deuda de formato ($(grep -cv '^#' "$bl") ficheros baselados, ${obsoletas} ya pagados)."
          rm -f "$bl"
          exit 0

      # NEGATIVO, Y QUE MIRE EL NOMBRE Y NO EL CODIGO DE SALIDA. Con la deuda
      # actual el hook VERIFY_ONLY sale con 1 aunque el fichero malo no
      # exista, asi que esperar "!= 0" probaria nada. Lo que prueba es que el
      # NOMBRE del fichero aparece en la salida del hook.
      - name: Hook catches unformatted code (negative test)
        shell: bash
        run: |
          printf 'int main(){return 0;}\n' > .hook_test_bad.cpp
          git add .hook_test_bad.cpp
          set +e
          VERIFY_ONLY=1 bash .githooks/pre-commit > "$RUNNER_TEMP/neg.log" 2>&1
          set -e
          git reset -q .hook_test_bad.cpp
          rm -f .hook_test_bad.cpp
          if ! grep -q 'hook_test_bad.cpp' "$RUNNER_TEMP/neg.log"; then
            echo "::error::el hook no ha nombrado el archivo mal formateado .hook_test_bad.cpp en su salida. VERIFY_ONLY puede estar roto."
            head -30 "$RUNNER_TEMP/neg.log"
            exit 1
          fi
          echo "El hook detecto y nombro el archivo mal formateado."
